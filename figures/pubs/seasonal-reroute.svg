<svg class="fig" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- TBS. The same commuters choose between a direct route through
       polluted air and a cleaner detour, once in winter and once in summer.
       Line weight shows which route wins in each season. -->
  <rect class="a-fade" x="12" y="12" width="184" height="180" rx="10" fill="#fbe9e4"/>
  <rect class="a-fade" style="--d:0.12s" x="204" y="12" width="184" height="180" rx="10" fill="#fdf3dc"/>
  <text x="30" y="42">Winter</text>
  <text x="222" y="42">Summer</text>
  <use class="a-pop h-pulse" style="--d:0.20s" href="#haze" x="160" y="20" width="26" height="26" color="#d24f38"/>
  <use class="a-pop h-spin" style="--d:0.30s" href="#sun" x="352" y="20" width="26" height="26" color="#e3a21a"/>
  <path class="a-draw" style="--d:0.35s" d="M40 164C44 96 96 70 168 78" fill="none" stroke="#2e9467" stroke-width="6" stroke-linecap="round"/><path class="a-draw" style="--d:0.50s" d="M40 164L168 78" fill="none" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/><g opacity="0.85"><use class="a-pop h-float" style="--d:0.80s;--w:0.00s" href="#haze" x="99" y="96" width="36" height="36" color="#d24f38"/></g><circle class="a-pop" style="--d:0.95s" cx="40" cy="164" r="6.5" fill="#2b2f36"/><circle class="a-pop" style="--d:1.05s" cx="168" cy="78" r="6.5" fill="#fff" stroke="#2b2f36" stroke-width="2.5"/>
  <path class="a-draw" style="--d:0.50s" d="M232 164C236 96 288 70 360 78" fill="none" stroke="#2e9467" stroke-width="2.5" stroke-linecap="round"/><path class="a-draw" style="--d:0.65s" d="M232 164L360 78" fill="none" stroke="#2b2f36" stroke-width="6" stroke-linecap="round"/><g opacity="0.35"><use class="a-pop h-float" style="--d:0.95s;--w:0.96s" href="#haze" x="291" y="96" width="36" height="36" color="#d24f38"/></g><circle class="a-pop" style="--d:1.10s" cx="232" cy="164" r="6.5" fill="#2b2f36"/><circle class="a-pop" style="--d:1.20s" cx="360" cy="78" r="6.5" fill="#fff" stroke="#2b2f36" stroke-width="2.5"/>
  <text class="sub" x="200" y="224" text-anchor="middle">Same 723 commuters, two survey waves</text>
</svg>
