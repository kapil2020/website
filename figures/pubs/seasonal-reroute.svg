<svg class="fig" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- TBS. The same commuters choose between a direct route through
       polluted air and a cleaner detour, once in winter and once in summer.
       Line weight shows which route wins in each season. -->
  <rect x="12" y="12" width="184" height="180" rx="10" fill="#fbe9e4"/>
  <rect x="204" y="12" width="184" height="180" rx="10" fill="#fdf3dc"/>
  <text x="30" y="42">Winter</text>
  <text x="222" y="42">Summer</text>
  <use href="#haze" x="160" y="20" width="26" height="26" class="c-red"/>
  <use href="#sun" x="352" y="20" width="26" height="26" class="c-amber"/>
  <path d="M40 164C44 96 96 70 168 78" fill="none" stroke="#2e9467" stroke-width="6" stroke-linecap="round"/><path d="M40 164L168 78" fill="none" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/><use href="#haze" x="99" y="96" width="36" height="36" class="c-red" opacity="0.85"/><circle cx="40" cy="164" r="6.5" fill="#2b2f36"/><circle cx="168" cy="78" r="6.5" fill="#fff" stroke="#2b2f36" stroke-width="2.5"/>
  <path d="M232 164C236 96 288 70 360 78" fill="none" stroke="#2e9467" stroke-width="2.5" stroke-linecap="round"/><path d="M232 164L360 78" fill="none" stroke="#2b2f36" stroke-width="6" stroke-linecap="round"/><use href="#haze" x="291" y="96" width="36" height="36" class="c-red" opacity="0.35"/><circle cx="232" cy="164" r="6.5" fill="#2b2f36"/><circle cx="360" cy="78" r="6.5" fill="#fff" stroke="#2b2f36" stroke-width="2.5"/>
  <text class="sub" x="200" y="224" text-anchor="middle">Same 723 commuters, two survey waves</text>
</svg>
