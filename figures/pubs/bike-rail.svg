<svg class="fig" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- J7. Cycling the first mile from home to a suburban rail station,
       with the health benefit that comes with it. -->
  <path d="M12 180H386" class="ln-g"/>
  <use class="a-fade" href="#house" x="14" y="124" width="56" height="56" color="#2b2f36"/>
  <path class="a-fade" style="--d:0.35s" d="M78 166H132" fill="none" stroke="#2e9467" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/>
  <g class="a-slide" style="--d:0.25s"><use class="h-float" href="#bike" x="136" y="116" width="66" height="66" color="#2e9467"/></g>
  <use class="a-pop h-pulse" style="--d:0.70s" href="#heart" x="157" y="84" width="24" height="24" color="#d24f38"/>
  <path class="a-fade" style="--d:0.80s" d="M210 166H256" fill="none" stroke="#2e9467" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/>
  <g class="a-fade" style="--d:0.45s">
    <rect x="262" y="82" width="124" height="10" rx="3" fill="#2b2f36"/>
    <path d="M272 92V178M376 92V178" class="ln-g"/>
    <rect x="262" y="174" width="124" height="7" rx="2" fill="#c9cfd6"/>
  </g>
  <use class="a-pop" style="--d:0.90s" href="#train" x="292" y="104" width="66" height="66" color="#2f6fca"/>
  <text class="sub" x="42" y="214" text-anchor="middle">Home</text>
  <text class="sub" x="169" y="214" text-anchor="middle">First mile</text>
  <text class="sub" x="324" y="214" text-anchor="middle">Suburban rail</text>
</svg>
