<svg class="fig" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- J5. DRUM: several routes between the same two points, around and
       through pollution hotspots. Street grid is schematic. -->
  <defs><clipPath id="drum-map"><rect x="12" y="12" width="376" height="190" rx="10"/></clipPath></defs>
  <g clip-path="url(#drum-map)">
    <rect x="12" y="12" width="376" height="190" fill="#eef1f4"/>
    <g stroke="#fff" stroke-width="9" stroke-linecap="round">
      <path d="M12 56H388M12 106H388M12 158H388M74 12V202M144 12V202M214 12V202M284 12V202M346 12V202"/>
    </g>
    <circle cx="182" cy="104" r="50" fill="url(#hot)"/>
    <circle cx="258" cy="54" r="42" fill="url(#hot)"/>
    <path d="M44 156H144V106H284V56H346" fill="none" stroke="#2b2f36" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M44 152H70V52H346" fill="none" stroke="#2f6fca" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M44 161H350V56" fill="none" stroke="#2e9467" stroke-width="4.5" stroke-linejoin="round"/>
  </g>
  <use href="#pin" x="30" y="128" width="28" height="28" class="c-ink"/>
  <use href="#pin" x="332" y="28" width="28" height="28" class="c-ink"/>
  <g style="font-size:16px">
    <path d="M14 225h18" stroke="#2b2f36" stroke-width="4.5" stroke-linecap="round"/>
    <text class="sub" x="38" y="230" style="font-size:16px">Fastest</text>
    <path d="M116 225h18" stroke="#2e9467" stroke-width="4.5" stroke-linecap="round"/>
    <text class="sub" x="140" y="230" style="font-size:16px">Least exposure</text>
    <path d="M262 225h18" stroke="#2f6fca" stroke-width="4.5" stroke-linecap="round"/>
    <text class="sub" x="286" y="230" style="font-size:16px">Least energy</text>
  </g>
</svg>
