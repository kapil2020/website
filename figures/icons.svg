    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e9467"/>
      <stop offset=".5" stop-color="#e3a21a"/>
      <stop offset="1" stop-color="#d24f38"/>
