
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kapil Kumar Meena | PhD Researcher | Sustainable Mobility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- LaTeX Font (Computer Modern) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              background: 'var(--color-background)',
              surface: 'var(--color-surface)',
              text: 'var(--color-text)',
              'text-muted': 'var(--color-text-muted)',
              accent: 'var(--color-accent)',
            },
            fontFamily: {
              sans: ['"Computer Modern Sans"', 'sans-serif'],
              serif: ['"Computer Modern Serif"', 'serif'],
              mono: ['"Computer Modern Typewriter"', 'monospace'],
              heading: ['"Computer Modern Serif"', 'serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'shimmer': 'shimmer 2s infinite linear',
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              blob: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                "100%": { transform: "translate(0px, 0px) scale(1)" }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-primary: #020617;
        --color-secondary: #334155;
        --color-background: #ffffff;
        --color-surface: #ffffff;
        --color-text: #0f172a;
        --color-text-muted: #475569;
        --color-accent: #2563eb;
        --glass-bg: rgba(255, 255, 255, 0.65);
      }

      .dark {
        --color-primary: #f8fafc;
        --color-secondary: #94a3b8;
        --color-background: #020617;
        --color-surface: #0f172a;
        --color-text: #f1f5f9;
        --color-text-muted: #94a3b8;
        --color-accent: #38bdf8;
        --glass-bg: rgba(15, 23, 42, 0.6);
      }

      body { 
        margin: 0; 
        background-color: var(--color-background); 
        color: var(--color-text);
        transition: background-color 0.5s ease;
        -webkit-font-smoothing: antialiased;
        font-family: "Computer Modern Serif", serif;
      }

      /* === BEAST MODE GLASS === */
      .premium-glass {
        background: var(--glass-bg);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 
          0 4px 6px -1px rgba(0, 0, 0, 0.05), 
          inset 0 0 20px rgba(255,255,255,0.5);
        transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
        overflow: hidden;
      }
      
      .dark .premium-glass {
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
      }

      .premium-glass:hover {
        transform: translateY(-5px);
        box-shadow: 
          0 20px 40px -10px rgba(var(--color-accent), 0.15),
          0 0 0 1px rgba(var(--color-accent), 0.2);
        border-color: var(--color-accent);
      }
      
      /* Rainbow Border Bottom */
      .glass-rainbow-border::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #3b82f6, #10b981, #f59e0b, #ec4899);
        opacity: 0.8;
      }

      /* Spotlight Effect */
      .spotlight-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(800px circle at var(--mouse-x, -100%) var(--mouse-y, -100%), rgba(56, 189, 248, 0.08), transparent 40%);
        pointer-events: none;
        z-index: 1;
        transition: opacity 0.3s;
        opacity: 0;
      }
      .spotlight-card:hover::before { opacity: 1; }

      /* Animated Background Blobs */
      .blob-bg {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
      }
      .blob {
        position: absolute;
        filter: blur(100px);
        opacity: 0.22;
        animation: blob 14s infinite alternate;
      }
      .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #2F80ED; }
      .blob-2 { bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: #9B51E0; animation-delay: 2s; }
      .blob-3 { top: 40%; left: 40%; width: 40vw; height: 40vw; background: #F2994A; animation-delay: 4s; }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .dark ::-webkit-scrollbar-thumb { background: #334155; }

      /* === Editorial / Academic motion utilities === */
      @keyframes word-cycle {
        0%, 22% { opacity: 1; transform: translateY(0); filter: blur(0); }
        25%, 97% { opacity: 0; transform: translateY(-10px); filter: blur(2px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      .rotating-word {
        position: absolute; left: 0; top: 0;
        animation: word-cycle 14s infinite ease-in-out;
        opacity: 0;
        white-space: nowrap;
      }
      .rotating-word:nth-child(1) { animation-delay: 0s; }
      .rotating-word:nth-child(2) { animation-delay: 3.5s; }
      .rotating-word:nth-child(3) { animation-delay: 7s; }
      .rotating-word:nth-child(4) { animation-delay: 10.5s; }

      @keyframes marquee-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .marquee-track {
        animation: marquee-scroll 45s linear infinite;
        will-change: transform;
      }
      .marquee-track:hover { animation-play-state: paused; }

      @keyframes spin-slow { to { transform: rotate(360deg); } }
      .spin-slow { animation: spin-slow 80s linear infinite; transform-origin: center; }
      .spin-rev  { animation: spin-slow 60s linear infinite reverse; transform-origin: center; }

      @keyframes draw-rule {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
      .draw-rule { transform-origin: left center; animation: draw-rule 1.4s cubic-bezier(0.2,0.8,0.2,1) 0.3s both; }

      @keyframes shimmer-text-kf {
        0%, 100% { background-position: 0% 50%; }
        50%      { background-position: 100% 50%; }
      }
      .shimmer-ink {
        background: linear-gradient(90deg, var(--color-text) 0%, var(--color-accent) 30%, #a855f7 55%, #ec4899 75%, var(--color-text) 100%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer-text-kf 8s ease-in-out infinite;
      }

      .academic-grid::before {
        content: '';
        position: absolute; inset: 0;
        background-image:
          linear-gradient(to right, rgba(15,23,42,0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(15,23,42,0.04) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 75%);
        pointer-events: none;
      }
      .dark .academic-grid::before {
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
      }

      .ink-underline {
        background-image: linear-gradient(90deg, currentColor, currentColor);
        background-size: 100% 2px;
        background-repeat: no-repeat;
        background-position: 0 100%;
        padding-bottom: 2px;
      }

      @keyframes float-soft {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
      }
      .float-soft { animation: float-soft 6s ease-in-out infinite; }

      .magnetic-btn { transition: transform .25s cubic-bezier(0.2,0.8,0.2,1), box-shadow .25s, background-color .25s; }
      .magnetic-btn:hover { transform: translateY(-2px); }
      .magnetic-btn:active { transform: translateY(0); }

      /* === Apple-style hero palette (#2F80ED #9B51E0 #EB5757 #F2994A) === */
      @keyframes apple-grad-shift {
        0%, 100% { background-position: 0% 50%; }
        50%      { background-position: 100% 50%; }
      }
      .apple-gradient-text {
        background: linear-gradient(90deg, #2F80ED 0%, #9B51E0 35%, #EB5757 70%, #F2994A 100%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: apple-grad-shift 12s ease-in-out infinite;
      }
      @keyframes apple-halo-spin { to { transform: rotate(360deg); } }
      .apple-halo {
        background: conic-gradient(from 0deg, #2F80ED, #9B51E0, #EB5757, #F2994A, #2F80ED);
        animation: apple-halo-spin 28s linear infinite;
      }
      .apple-arrow { display: inline-block; transition: transform .35s cubic-bezier(0.2,0.8,0.2,1); }
      .group:hover .apple-arrow { transform: translateX(5px); }
      @keyframes hero-blob-drift {
        0%, 100% { transform: translate(0,0) scale(1); }
        33%      { transform: translate(40px,-30px) scale(1.08); }
        66%      { transform: translate(-30px,30px) scale(0.94); }
      }
      .hero-blob { animation: hero-blob-drift 18s ease-in-out infinite; }
      @keyframes scroll-cue {
        0%, 100% { transform: translateY(0); opacity: .5; }
        50%      { transform: translateY(6px); opacity: 1; }
      }
      .scroll-cue { animation: scroll-cue 2.4s ease-in-out infinite; }

      /* === Coding-aesthetic hero animations === */
      @keyframes type-reveal { to { clip-path: inset(0 0 0 0); } }
      .typewriter-line {
        clip-path: inset(0 100% 0 0);
        animation: type-reveal 3.6s steps(60, end) forwards;
      }
      @keyframes caret-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .caret { display: inline-block; width: 0.55ch; height: 1.05em; vertical-align: -0.15em; background: currentColor; margin-left: 4px; animation: caret-blink 1.05s steps(2) infinite; }

      @keyframes line-fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .code-line { opacity: 0; animation: line-fade-up .55s cubic-bezier(0.2,0.8,0.2,1) forwards; }

      .code-window {
        background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(248,250,252,0.85) 100%);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(15,23,42,0.08);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.6) inset,
          0 22px 40px -20px rgba(15,23,42,0.20),
          0 4px 14px -4px rgba(15,23,42,0.08);
      }
      .dark .code-window {
        background: linear-gradient(180deg, rgba(15,23,42,0.78) 0%, rgba(2,6,23,0.78) 100%);
        border-color: rgba(255,255,255,0.08);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.04) inset,
          0 22px 40px -20px rgba(0,0,0,0.55);
      }

      .syn-key { color: #9B51E0; }
      .syn-prop { color: #2F80ED; }
      .syn-str { color: #F2994A; }
      .syn-punct { color: #94a3b8; }
      .syn-num { color: #EB5757; }
      .ln-num { color: rgba(100,116,139,0.6); user-select: none; }

      @keyframes prompt-glow { 0%,100% { box-shadow: 0 0 0 0 rgba(47,128,237,0.0); } 50% { box-shadow: 0 0 0 4px rgba(47,128,237,0.18); } }
      .prompt-dot { animation: prompt-glow 3.2s ease-in-out infinite; }

      /* === Award-grade section system === */
      @keyframes sec-rule-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .sec-rule { transform-origin: left center; animation: sec-rule-grow 1.2s cubic-bezier(0.2,0.8,0.2,1) forwards; }

      .sec-watermark {
        position: absolute;
        font-family: "Computer Modern Serif", serif;
        font-weight: 900;
        font-size: clamp(7rem, 14vw, 13rem);
        line-height: 0.78;
        color: rgba(15,23,42,0.045);
        pointer-events: none;
        user-select: none;
        letter-spacing: -0.05em;
        z-index: 0;
      }
      .dark .sec-watermark { color: rgba(255,255,255,0.045); }

      /* Refined card surface — replaces the heavy premium-glass for cards */
      .pro-card {
        position: relative;
        background: rgba(255,255,255,0.72);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        border: 1px solid rgba(15,23,42,0.07);
        border-radius: 18px;
        transition: transform .45s cubic-bezier(0.2,0.8,0.2,1),
                    box-shadow .45s cubic-bezier(0.2,0.8,0.2,1),
                    border-color .45s;
        box-shadow:
          0 1px 0 rgba(255,255,255,0.55) inset,
          0 1px 2px rgba(15,23,42,0.04),
          0 4px 14px -6px rgba(15,23,42,0.05);
      }
      .pro-card:hover {
        transform: translateY(-4px);
        border-color: rgba(47,128,237,0.22);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.55) inset,
          0 18px 36px -14px rgba(47,128,237,0.18),
          0 6px 18px -6px rgba(15,23,42,0.10);
      }
      .dark .pro-card {
        background: rgba(15,23,42,0.55);
        border-color: rgba(255,255,255,0.08);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.04) inset,
          0 8px 24px -10px rgba(0,0,0,0.45);
      }
      .dark .pro-card:hover {
        border-color: rgba(56,189,248,0.30);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.04) inset,
          0 22px 50px -18px rgba(56,189,248,0.20);
      }

      /* Subtle accent ribbon along the top of cards */
      .pro-card::before {
        content: '';
        position: absolute; left: 14px; right: 14px; top: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(47,128,237,0.0), transparent);
        transition: background .5s ease;
        border-radius: 2px;
      }
      .pro-card:hover::before {
        background: linear-gradient(90deg, transparent, rgba(47,128,237,0.55), rgba(155,81,224,0.55), rgba(235,87,87,0.55), transparent);
      }

      /* Section section padding utility — tighten the global rhythm */
      .sec-pad { padding-top: 4.5rem; padding-bottom: 4.5rem; }
      @media (min-width: 768px) { .sec-pad { padding-top: 5.5rem; padding-bottom: 5.5rem; } }

      /* Reveal-on-scroll helper for non-motion children (kept, used selectively) */
      @keyframes reveal-up {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Heading underline that draws on hover */
      .head-underline { background-image: linear-gradient(90deg, #2F80ED, #9B51E0); background-size: 0% 2px; background-repeat: no-repeat; background-position: 0 100%; padding-bottom: 4px; transition: background-size .55s cubic-bezier(0.2,0.8,0.2,1); }
      .head-underline:hover { background-size: 100% 2px; }

      /* === Tier 1 features — scroll progress, toast, BibTeX button, ⌘K palette === */
      #scroll-progress {
        position: fixed; top: 0; left: 0; height: 3px; width: 0;
        background: linear-gradient(90deg, #2F80ED 0%, #9B51E0 33%, #EB5757 66%, #F2994A 100%);
        z-index: 9999; pointer-events: none;
        transition: width .12s linear;
        box-shadow: 0 0 8px rgba(47,128,237,0.4);
      }
      .app-toast {
        position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 24px);
        background: rgba(15,23,42,0.94); color: #fff;
        padding: 10px 18px; border-radius: 999px; font-size: 13px;
        font-family: "Computer Modern Typewriter", ui-monospace, monospace;
        letter-spacing: 0.02em;
        box-shadow: 0 12px 30px -8px rgba(15,23,42,0.45), 0 0 0 1px rgba(255,255,255,0.06) inset;
        opacity: 0; pointer-events: none;
        transition: opacity .25s ease, transform .35s cubic-bezier(0.2,0.8,0.2,1);
        z-index: 10001;
        display: flex; align-items: center; gap: 10px;
      }
      .app-toast.show { opacity: 1; transform: translate(-50%, 0); }
      .app-toast .toast-dot { width: 8px; height: 8px; border-radius: 50%; background: #2F80ED; box-shadow: 0 0 0 4px rgba(47,128,237,0.18); }

      .bib-btn {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 4px 9px; border-radius: 7px; font-size: 11px; font-weight: 700;
        font-family: "Computer Modern Typewriter", ui-monospace, monospace;
        letter-spacing: 0.04em;
        background: rgba(155,81,224,0.08);
        color: #9B51E0;
        border: 1px solid rgba(155,81,224,0.22);
        cursor: pointer;
        transition: background .25s, border-color .25s, transform .15s;
      }
      .bib-btn:hover { background: rgba(155,81,224,0.15); border-color: rgba(155,81,224,0.45); }
      .bib-btn:active { transform: scale(0.96); }

      /* ===== ⌘K Command Palette ===== */
      #cmdk-root { position: fixed; inset: 0; z-index: 10000; display: none; }
      #cmdk-root.open { display: block; }
      .cmdk-backdrop {
        position: absolute; inset: 0;
        background: rgba(15,23,42,0.55);
        backdrop-filter: blur(8px) saturate(140%);
        -webkit-backdrop-filter: blur(8px) saturate(140%);
        animation: cmdk-fade .25s ease both;
      }
      @keyframes cmdk-fade { from { opacity: 0; } to { opacity: 1; } }
      .cmdk-shell {
        position: relative;
        width: min(640px, calc(100% - 32px));
        margin: 12vh auto 0;
        background: rgba(255,255,255,0.96);
        border: 1px solid rgba(15,23,42,0.08);
        border-radius: 16px;
        box-shadow: 0 24px 64px -12px rgba(15,23,42,0.35), 0 0 0 1px rgba(255,255,255,0.6) inset;
        overflow: hidden;
        font-family: "Computer Modern Serif", serif;
        animation: cmdk-pop .35s cubic-bezier(0.2,0.8,0.2,1) both;
      }
      .dark .cmdk-shell {
        background: rgba(15,23,42,0.96);
        border-color: rgba(255,255,255,0.10);
      }
      @keyframes cmdk-pop { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .cmdk-input-row {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 18px; border-bottom: 1px solid rgba(15,23,42,0.06);
      }
      .dark .cmdk-input-row { border-bottom-color: rgba(255,255,255,0.06); }
      .cmdk-prompt {
        font-family: "Computer Modern Typewriter", ui-monospace, monospace;
        font-size: 11px; font-weight: 700;
        color: #fff; background: linear-gradient(135deg, #2F80ED, #9B51E0);
        padding: 4px 8px; border-radius: 6px; letter-spacing: 0.06em;
        box-shadow: 0 2px 8px rgba(155,81,224,0.32);
      }
      .cmdk-input {
        flex: 1; background: transparent; border: 0; outline: 0;
        font-family: "Computer Modern Serif", serif;
        font-size: 17px; color: var(--color-text);
      }
      .cmdk-kbd {
        font-family: "Computer Modern Typewriter", ui-monospace, monospace;
        font-size: 10px; font-weight: 700;
        padding: 3px 7px; border-radius: 5px;
        background: rgba(15,23,42,0.06); color: var(--color-text-muted);
        border: 1px solid rgba(15,23,42,0.08);
      }
      .dark .cmdk-kbd { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.08); }
      .cmdk-list {
        list-style: none; margin: 0; padding: 8px;
        max-height: 56vh; overflow-y: auto;
      }
      .cmdk-item {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 12px; border-radius: 10px;
        cursor: pointer; user-select: none;
        font-size: 14px; color: var(--color-text);
        transition: background .15s ease;
      }
      .cmdk-item .cmdk-grp {
        font-family: "Computer Modern Typewriter", ui-monospace, monospace;
        font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--color-text-muted); margin-left: auto;
      }
      .cmdk-item .cmdk-icon {
        width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
        border-radius: 7px; font-size: 13px;
        background: rgba(47,128,237,0.10); color: #2F80ED;
      }
      .cmdk-item.active, .cmdk-item:hover { background: rgba(47,128,237,0.10); }
      .dark .cmdk-item.active, .dark .cmdk-item:hover { background: rgba(56,189,248,0.10); }
      .cmdk-section {
        font-family: "Computer Modern Typewriter", ui-monospace, monospace;
        font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--color-text-muted);
        padding: 10px 14px 4px; opacity: 0.7;
      }
      .cmdk-foot {
        display: flex; gap: 14px; padding: 10px 16px;
        border-top: 1px solid rgba(15,23,42,0.06);
        font-family: "Computer Modern Typewriter", ui-monospace, monospace;
        font-size: 10px; color: var(--color-text-muted);
      }
      .dark .cmdk-foot { border-top-color: rgba(255,255,255,0.06); }
      .cmdk-foot kbd {
        font-family: inherit; font-size: 10px; font-weight: 700;

      .cmdk-hint:hover { transform: translateY(-2px); }
      .dark .cmdk-hint { background: rgba(15,23,42,0.85); border-color: rgba(255,255,255,0.10); }
      .cmdk-hint kbd {
        font-family: inherit; font-size: 10px; font-weight: 700;
        padding: 2px 6px; border-radius: 4px;
        background: rgba(15,23,42,0.06); border: 1px solid rgba(15,23,42,0.08);
        color: var(--color-text);
      }
      .dark .cmdk-hint kbd { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.10); color: #fff; }
      @media (max-width: 640px) { .cmdk-hint { display: none; } }

<link rel="stylesheet" href="/index.css">
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

  <body>
    <div class="blob-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div id="root"></div>

    <!-- Tier-1 runtime: scroll progress, ⌘K palette, BibTeX copy, animated counters -->
    <div id="scroll-progress"></div>
    <div id="cmdk-root" aria-hidden="true">
      <div class="cmdk-backdrop" data-cmdk-close></div>
      <div class="cmdk-shell" role="dialog" aria-modal="true" aria-label="Command Palette">
        <div class="cmdk-input-row">
          <span class="cmdk-prompt">⌘K</span>
          <input class="cmdk-input" id="cmdk-input" placeholder="Type a command or jump to a section…" autocomplete="off" spellcheck="false" />
          <kbd class="cmdk-kbd" data-cmdk-close>ESC</kbd>
        </div>
        <ul class="cmdk-list" id="cmdk-list" role="listbox"></ul>
        <div class="cmdk-foot">
          <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
          <span><kbd>↵</kbd> select</span>
          <span><kbd>esc</kbd> close</span>
          <span style="margin-left:auto;opacity:0.7;">kapil-meena.dev</span>
        </div>
      </div>
    </div>
    <button class="cmdk-hint" id="cmdk-hint" aria-label="Open command palette"><kbd>⌘</kbd><kbd>K</kbd> Quick nav</button>

    <script>
    (function(){
      // ---------- Console easter-egg ----------
      try {
        var ascii = [
          '',
          '  _  __          _ _ ',
          " | |/ /__ _ _ __(_) |",
          " | ' // _` | '_ \\\\ | |",
          ' | . \\\\ (_| | |_) ||_|',
          ' |_|\\\\_\\\\__,_| .__(_|_)',
          '             |_|     ',
          ''
        ].join('\n');
        console.log('%c' + ascii, 'color:#2F80ED;font-family:ui-monospace,monospace;font-size:11px;line-height:1.1');
        console.log('%cHey there, fellow developer! 👋', 'font-size:15px;font-weight:700;color:#9B51E0');
        console.log('%cThis portfolio was crafted with React + Vite + Tailwind, hand-tuned animations, and a lot of LaTeX love.', 'font-size:12px;color:#475569');
        console.log('%cPress %c⌘K%c (or Ctrl+K) to open the command palette.', 'font-size:12px;color:#475569', 'background:#0f172a;color:#fff;padding:1px 6px;border-radius:4px;font-family:ui-monospace,monospace', 'font-size:12px;color:#475569');
        console.log('%c→ Reach out: kapil.meena@kgpian.iitkgp.ac.in', 'font-size:12px;color:#EB5757;font-weight:600');
        console.log('%c→ Code:      github.com/kapil2020', 'font-size:12px;color:#F2994A;font-weight:600');
      } catch(e){}

      // ---------- Scroll progress bar ----------
      var bar = document.getElementById('scroll-progress');
      function updateProgress(){
        var h = document.documentElement, b = document.body;
        var total = (h.scrollHeight || b.scrollHeight) - h.clientHeight;
        var pct = total > 0 ? (h.scrollTop || b.scrollTop) / total * 100 : 0;
        bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
      }
      addEventListener('scroll', updateProgress, {passive:true});
      addEventListener('resize', updateProgress, {passive:true});
      requestAnimationFrame(updateProgress);

      // ---------- Toast helper ----------
      function toast(msg){
        var t = document.createElement('div');
        t.className = 'app-toast';
        t.innerHTML = '<span class="toast-dot"></span>' + msg;
        document.body.appendChild(t);
        requestAnimationFrame(function(){ t.classList.add('show'); });
        setTimeout(function(){
          t.classList.remove('show');
          setTimeout(function(){ t.remove(); }, 320);
        }, 2200);
      }
      function copyText(text, message){
        var done = function(){ toast(message || 'Copied to clipboard'); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function(){ fallback(); });
        } else { fallback(); }
        function fallback(){
          var ta = document.createElement('textarea');
          ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); done(); } catch(e){}
          ta.remove();
        }
      }
      window.__toast = toast; window.__copyText = copyText;

      // ---------- BibTeX builder + click handler ----------
      function slug(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,12); }
      function buildBibtex(d){
        var firstAuthor = (d.authors||'').split(',')[0].trim().replace(/\\./g,'').split(/\\s+/).pop() || 'meena';
        var firstTitleWord = (d.title||'paper').split(/\\s+/).map(function(w){return w.replace(/[^a-zA-Z]/g,'');}).filter(Boolean)[0] || 'paper';
        var key = slug(firstAuthor) + (d.year||'') + slug(firstTitleWord);
        var authors = (d.authors||'').split(',').map(function(a){return a.trim();}).filter(Boolean).join(' and ');
        var isJournal = ((d.type||'')+'').toLowerCase().indexOf('journal') !== -1;
        var entry = isJournal ? 'article' : 'inproceedings';
        var venueKey = isJournal ? 'journal' : 'booktitle';
        var lines = [
          '@' + entry + '{' + key + ',',
          '  title   = {' + (d.title||'') + '},',
          '  author  = {' + authors + '},',
          '  ' + venueKey + ' = {' + (d.venue||'') + '},',
          '  year    = {' + (d.year||'') + '},'
        ];
        if (d.status) lines.push('  note    = {' + d.status + '},');
        if (d.link)   lines.push('  url     = {' + d.link + '},');
        lines.push('}');
        return lines.join('\\n');
      }
      document.addEventListener('click', function(ev){
        var btn = ev.target.closest && ev.target.closest('[data-bib-title]');
        if (!btn) return;
        ev.preventDefault();
        var d = {
          title: btn.getAttribute('data-bib-title'),
          authors: btn.getAttribute('data-bib-authors'),
          venue: btn.getAttribute('data-bib-venue'),
          year: btn.getAttribute('data-bib-year'),
          type: btn.getAttribute('data-bib-type'),
          status: btn.getAttribute('data-bib-status'),
          link: btn.getAttribute('data-bib-link')
        };
        copyText(buildBibtex(d), 'BibTeX copied to clipboard');
      });

      // ---------- Animated stat counters ----------
      function animateCounter(el){
        var target = parseInt(el.getAttribute('data-counter'), 10);
        var suffix = el.getAttribute('data-suffix') || '';
        if (isNaN(target)) return;
        var duration = 1600;
        var start = performance.now();
        function step(now){
          var t = Math.min((now - start) / duration, 1);
          var eased = 1 - Math.pow(1 - t, 3);
          el.textContent = Math.round(target * eased) + suffix;
          if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }
      var counterIO = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if (e.isIntersecting && !e.target.dataset.counterDone){
            e.target.dataset.counterDone = '1';
            animateCounter(e.target);
            counterIO.unobserve(e.target);
          }
        });
      }, {threshold: 0.45}) : null;
      function scanCounters(){
        var nodes = document.querySelectorAll('[data-counter]:not([data-counter-init])');
        nodes.forEach(function(el){
          el.dataset.counterInit = '1';
          el.textContent = '0' + (el.getAttribute('data-suffix')||'');
          if (counterIO) counterIO.observe(el); else animateCounter(el);
        });
      }
      // React renders after this script runs; scan periodically + on mutations
      scanCounters();
      var mo = new MutationObserver(function(){ scanCounters(); });
      mo.observe(document.body, {childList:true, subtree:true});

      // ---------- ⌘K Command Palette ----------
      var SCHOLAR = 'https://scholar.google.com/citations?user=5jIAPTEAAAAJ&hl=en';
      var GITHUB  = 'https://github.com/kapil2020';
      var LINKEDIN= 'https://www.linkedin.com/in/kapilmeena/';
      var EMAIL   = 'kapil.meena@kgpian.iitkgp.ac.in';
      var HUMAN   = 'https://sites.google.com/cornell.edu/youngseokim/human-lab?authuser=0';

      var CMDS = [
        // navigation
        {label:'Home',          group:'Navigate', icon:'⌂', kw:'home top intro hero', run:function(){go('home');}},
        {label:'About',         group:'Navigate', icon:'§', kw:'about bio',           run:function(){go('about');}},
        {label:'Research',      group:'Navigate', icon:'∰', kw:'research areas',     run:function(){go('research');}},
        {label:'Publications',  group:'Navigate', icon:'¶', kw:'publications papers journal trr', run:function(){go('publications');}},
        {label:'Projects',      group:'Navigate', icon:'⌘', kw:'projects code repos',run:function(){go('projects');}},
        {label:'Experience',    group:'Navigate', icon:'☗', kw:'experience career',  run:function(){go('experience');}},
        {label:'Awards',        group:'Navigate', icon:'★', kw:'awards honors',      run:function(){go('awards');}},
        {label:'Skills',        group:'Navigate', icon:'⌥', kw:'skills stack',       run:function(){go('skills');}},
        {label:'Leadership',    group:'Navigate', icon:'☉', kw:'leadership service', run:function(){go('leadership');}},
        {label:'Travel',        group:'Navigate', icon:'⌖', kw:'travel global footprint', run:function(){go('travel');}},
        {label:'Contact',       group:'Navigate', icon:'✉', kw:'contact email',      run:function(){go('contact');}},
        // actions
        {label:'Copy email address',   group:'Action', icon:'✎', kw:'email copy mail',  run:function(){copyText(EMAIL,'Email copied · ' + EMAIL);}},
        {label:'Open Google Scholar',  group:'Open',   icon:'⌬', kw:'scholar publications citations google', run:function(){window.open(SCHOLAR,'_blank','noopener');}},
        {label:'Open GitHub profile',  group:'Open',   icon:'⎈', kw:'github code repos source', run:function(){window.open(GITHUB,'_blank','noopener');}},
        {label:'Open LinkedIn',        group:'Open',   icon:'⌖', kw:'linkedin profile network', run:function(){window.open(LINKEDIN,'_blank','noopener');}},
        {label:'Open HUMAN Lab (UCLA)',group:'Open',   icon:'∇', kw:'ucla human lab youngseo postdoc', run:function(){window.open(HUMAN,'_blank','noopener');}},
        {label:'Toggle dark mode',     group:'Action', icon:'☾', kw:'dark light theme mode toggle', run:function(){document.documentElement.classList.toggle('dark');}},
        {label:'Scroll to top',        group:'Action', icon:'↑', kw:'top scroll up', run:function(){window.scrollTo({top:0,behavior:'smooth'});}},
        {label:'Print / Save as PDF',  group:'Action', icon:'⎙', kw:'print pdf cv resume', run:function(){window.print();}}
      ];
      function go(id){
        var el = document.getElementById(id);
        if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
        else { location.hash = '#' + id; }
      }

      var root = document.getElementById('cmdk-root');
      var input = document.getElementById('cmdk-input');
      var list = document.getElementById('cmdk-list');
      var hintBtn = document.getElementById('cmdk-hint');
      var active = 0;
      var filtered = CMDS.slice();

      function score(item, q){
        if (!q) return 1;
        q = q.toLowerCase();
        var hay = (item.label + ' ' + (item.kw||'')).toLowerCase();
        if (hay.indexOf(q) !== -1) return 2;
        // simple subsequence
        var i = 0, j = 0;
        while (i < hay.length && j < q.length){
          if (hay[i] === q[j]) j++;
          i++;
        }
        return j === q.length ? 1 : 0;
      }
      function render(){
        list.innerHTML = '';
        var q = input.value.trim();
        filtered = CMDS.map(function(c){ return {c:c, s:score(c,q)}; })
                       .filter(function(x){ return x.s > 0; })
                       .sort(function(a,b){ return b.s - a.s; })
                       .map(function(x){ return x.c; });
        if (filtered.length === 0){
          list.innerHTML = '<li class="cmdk-empty">No matches for "' + q.replace(/[<>&]/g,'') + '"</li>';
          return;
        }
        active = 0;
        var lastGroup = null;
        filtered.forEach(function(c, i){
          if (c.group !== lastGroup){
            var sec = document.createElement('li');
            sec.className = 'cmdk-section';
            sec.textContent = c.group;
            list.appendChild(sec);
            lastGroup = c.group;
          }
          var li = document.createElement('li');
          li.className = 'cmdk-item' + (i === 0 ? ' active' : '');
          li.setAttribute('role','option');
          li.setAttribute('data-idx', i);
          li.innerHTML = '<span class="cmdk-icon">' + c.icon + '</span><span class="cmdk-label"></span><span class="cmdk-grp">' + c.group + '</span>';
          li.querySelector('.cmdk-label').textContent = c.label;
          li.addEventListener('mouseenter', function(){ setActive(i); });
          li.addEventListener('click', function(){ run(i); });
          list.appendChild(li);
        });
      }
      function setActive(i){
        active = i;
        var items = list.querySelectorAll('.cmdk-item');
        items.forEach(function(el){ el.classList.remove('active'); });
        var idx = Array.prototype.findIndex.call(items, function(el){ return +el.getAttribute('data-idx') === i; });
        if (idx >= 0){
          items[idx].classList.add('active');
          items[idx].scrollIntoView({block:'nearest'});
        }
      }
      function run(i){
        var c = filtered[i];
        if (!c) return;
        close();
        setTimeout(function(){ try{ c.run(); }catch(e){ console.error(e); } }, 60);
      }
      function open(){
        root.classList.add('open');
        root.setAttribute('aria-hidden','false');
        input.value = '';
        render();
        setTimeout(function(){ input.focus(); }, 30);
      }
      function close(){
        root.classList.remove('open');
        root.setAttribute('aria-hidden','true');
      }
      addEventListener('keydown', function(ev){
        var open_ = root.classList.contains('open');
        if ((ev.metaKey || ev.ctrlKey) && (ev.key === 'k' || ev.key === 'K')){
          ev.preventDefault();
          if (open_) close(); else open();
          return;
        }
        if (!open_) return;
        if (ev.key === 'Escape'){ ev.preventDefault(); close(); }
        else if (ev.key === 'ArrowDown'){ ev.preventDefault(); setActive(Math.min(active+1, filtered.length-1)); }
        else if (ev.key === 'ArrowUp'){ ev.preventDefault(); setActive(Math.max(active-1, 0)); }
        else if (ev.key === 'Enter'){ ev.preventDefault(); run(active); }
      });
      input.addEventListener('input', render);
      root.querySelectorAll('[data-cmdk-close]').forEach(function(el){
        el.addEventListener('click', close);
      });
      hintBtn.addEventListener('click', open);
    })();
    </script>
