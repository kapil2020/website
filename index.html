
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kapil Kumar Meena | PhD Researcher | Sustainable Mobility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- LaTeX Font (Computer Modern) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              background: 'var(--color-background)',
              surface: 'var(--color-surface)',
              text: 'var(--color-text)',
              'text-muted': 'var(--color-text-muted)',
              accent: 'var(--color-accent)',
            },
            fontFamily: {
              sans: ['"Computer Modern Sans"', 'sans-serif'],
              serif: ['"Computer Modern Serif"', 'serif'],
              mono: ['"Computer Modern Typewriter"', 'monospace'],
              heading: ['"Computer Modern Serif"', 'serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'shimmer': 'shimmer 2s infinite linear',
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              blob: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                "100%": { transform: "translate(0px, 0px) scale(1)" }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-primary: #020617;
        --color-secondary: #334155;
        --color-background: #ffffff;
        --color-surface: #ffffff;
        --color-text: #0f172a;
        --color-text-muted: #475569;
        --color-accent: #2563eb;
        --glass-bg: rgba(255, 255, 255, 0.65);
      }

      .dark {
        --color-primary: #f8fafc;
        --color-secondary: #94a3b8;
        --color-background: #020617;
        --color-surface: #0f172a;
        --color-text: #f1f5f9;
        --color-text-muted: #94a3b8;
        --color-accent: #38bdf8;
        --glass-bg: rgba(15, 23, 42, 0.6);
      }

      body { 
        margin: 0; 
        background-color: var(--color-background); 
        color: var(--color-text);
        transition: background-color 0.5s ease;
        -webkit-font-smoothing: antialiased;
        font-family: "Computer Modern Serif", serif;
      }

      /* === BEAST MODE GLASS === */
      .premium-glass {
        background: var(--glass-bg);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 
          0 4px 6px -1px rgba(0, 0, 0, 0.05), 
          inset 0 0 20px rgba(255,255,255,0.5);
        transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
        overflow: hidden;
      }
      
      .dark .premium-glass {
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
      }

      .premium-glass:hover {
        transform: translateY(-5px);
        box-shadow: 
          0 20px 40px -10px rgba(var(--color-accent), 0.15),
          0 0 0 1px rgba(var(--color-accent), 0.2);
        border-color: var(--color-accent);
      }
      
      /* Rainbow Border Bottom */
      .glass-rainbow-border::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #3b82f6, #10b981, #f59e0b, #ec4899);
        opacity: 0.8;
      }

      /* Spotlight Effect */
      .spotlight-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(800px circle at var(--mouse-x, -100%) var(--mouse-y, -100%), rgba(56, 189, 248, 0.08), transparent 40%);
        pointer-events: none;
        z-index: 1;
        transition: opacity 0.3s;
        opacity: 0;
      }
      .spotlight-card:hover::before { opacity: 1; }

      /* Animated Background Blobs */
      .blob-bg {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
      }
      .blob {
        position: absolute;
        filter: blur(100px);
        opacity: 0.22;
        animation: blob 14s infinite alternate;
      }
      .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #2F80ED; }
      .blob-2 { bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: #9B51E0; animation-delay: 2s; }
      .blob-3 { top: 40%; left: 40%; width: 40vw; height: 40vw; background: #F2994A; animation-delay: 4s; }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .dark ::-webkit-scrollbar-thumb { background: #334155; }

      /* === Editorial / Academic motion utilities === */
      @keyframes word-cycle {
        0%, 22% { opacity: 1; transform: translateY(0); filter: blur(0); }
        25%, 97% { opacity: 0; transform: translateY(-10px); filter: blur(2px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      .rotating-word {
        position: absolute; left: 0; top: 0;
        animation: word-cycle 14s infinite ease-in-out;
        opacity: 0;
        white-space: nowrap;
      }
      .rotating-word:nth-child(1) { animation-delay: 0s; }
      .rotating-word:nth-child(2) { animation-delay: 3.5s; }
      .rotating-word:nth-child(3) { animation-delay: 7s; }
      .rotating-word:nth-child(4) { animation-delay: 10.5s; }

      @keyframes marquee-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .marquee-track {
        animation: marquee-scroll 45s linear infinite;
        will-change: transform;
      }
      .marquee-track:hover { animation-play-state: paused; }

      @keyframes spin-slow { to { transform: rotate(360deg); } }
      .spin-slow { animation: spin-slow 80s linear infinite; transform-origin: center; }
      .spin-rev  { animation: spin-slow 60s linear infinite reverse; transform-origin: center; }

      @keyframes draw-rule {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
      .draw-rule { transform-origin: left center; animation: draw-rule 1.4s cubic-bezier(0.2,0.8,0.2,1) 0.3s both; }

      @keyframes shimmer-text-kf {
        0%, 100% { background-position: 0% 50%; }
        50%      { background-position: 100% 50%; }
      }
      .shimmer-ink {
        background: linear-gradient(90deg, var(--color-text) 0%, var(--color-accent) 30%, #a855f7 55%, #ec4899 75%, var(--color-text) 100%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer-text-kf 8s ease-in-out infinite;
      }

      .academic-grid::before {
        content: '';
        position: absolute; inset: 0;
        background-image:
          linear-gradient(to right, rgba(15,23,42,0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(15,23,42,0.04) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 75%);
        pointer-events: none;
      }
      .dark .academic-grid::before {
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
      }

      .ink-underline {
        background-image: linear-gradient(90deg, currentColor, currentColor);
        background-size: 100% 2px;
        background-repeat: no-repeat;
        background-position: 0 100%;
        padding-bottom: 2px;
      }

      @keyframes float-soft {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
      }
      .float-soft { animation: float-soft 6s ease-in-out infinite; }

      .magnetic-btn { transition: transform .25s cubic-bezier(0.2,0.8,0.2,1), box-shadow .25s, background-color .25s; }
      .magnetic-btn:hover { transform: translateY(-2px); }
      .magnetic-btn:active { transform: translateY(0); }

      /* === Apple-style hero palette (#2F80ED #9B51E0 #EB5757 #F2994A) === */
      @keyframes apple-grad-shift {
        0%, 100% { background-position: 0% 50%; }
        50%      { background-position: 100% 50%; }
      }
      .apple-gradient-text {
        background: linear-gradient(90deg, #2F80ED 0%, #9B51E0 35%, #EB5757 70%, #F2994A 100%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: apple-grad-shift 12s ease-in-out infinite;
      }
      @keyframes apple-halo-spin { to { transform: rotate(360deg); } }
      .apple-halo {
        background: conic-gradient(from 0deg, #2F80ED, #9B51E0, #EB5757, #F2994A, #2F80ED);
        animation: apple-halo-spin 28s linear infinite;
      }
      .apple-arrow { display: inline-block; transition: transform .35s cubic-bezier(0.2,0.8,0.2,1); }
      .group:hover .apple-arrow { transform: translateX(5px); }
      @keyframes hero-blob-drift {
        0%, 100% { transform: translate(0,0) scale(1); }
        33%      { transform: translate(40px,-30px) scale(1.08); }
        66%      { transform: translate(-30px,30px) scale(0.94); }
      }
      .hero-blob { animation: hero-blob-drift 18s ease-in-out infinite; }
      @keyframes scroll-cue {
        0%, 100% { transform: translateY(0); opacity: .5; }
        50%      { transform: translateY(6px); opacity: 1; }
      }
      .scroll-cue { animation: scroll-cue 2.4s ease-in-out infinite; }

      /* === Coding-aesthetic hero animations === */
      @keyframes type-reveal { to { clip-path: inset(0 0 0 0); } }
      .typewriter-line {
        clip-path: inset(0 100% 0 0);
        animation: type-reveal 3.6s steps(60, end) forwards;
      }
      @keyframes caret-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .caret { display: inline-block; width: 0.55ch; height: 1.05em; vertical-align: -0.15em; background: currentColor; margin-left: 4px; animation: caret-blink 1.05s steps(2) infinite; }

      @keyframes line-fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .code-line { opacity: 0; animation: line-fade-up .55s cubic-bezier(0.2,0.8,0.2,1) forwards; }

      .code-window {
        background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(248,250,252,0.85) 100%);
        backdrop-filter: blur(20px) saturate(160%);
        -webkit-backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(15,23,42,0.08);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.6) inset,
          0 22px 40px -20px rgba(15,23,42,0.20),
          0 4px 14px -4px rgba(15,23,42,0.08);
      }
      .dark .code-window {
        background: linear-gradient(180deg, rgba(15,23,42,0.78) 0%, rgba(2,6,23,0.78) 100%);
        border-color: rgba(255,255,255,0.08);
        box-shadow:
          0 1px 0 rgba(255,255,255,0.04) inset,
          0 22px 40px -20px rgba(0,0,0,0.55);
      }

      .syn-key { color: #9B51E0; }
      .syn-prop { color: #2F80ED; }
      .syn-str { color: #F2994A; }
      .syn-punct { color: #94a3b8; }
      .syn-num { color: #EB5757; }
      .ln-num { color: rgba(100,116,139,0.6); user-select: none; }

      @keyframes prompt-glow { 0%,100% { box-shadow: 0 0 0 0 rgba(47,128,237,0.0); } 50% { box-shadow: 0 0 0 4px rgba(47,128,237,0.18); } }
      .prompt-dot { animation: prompt-glow 3.2s ease-in-out infinite; }
    </style>
